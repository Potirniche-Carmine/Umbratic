[workspace]
members = ["apps/desktop/native", "packages/artifacts", "packages/code-index", "packages/pdf", "packages/runner"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
# PDF parsing runs inside catch_unwind, including when linked into the runner.
panic = "unwind"
strip = "symbols"

[patch.crates-io]
umya-spreadsheet = { path = "third_party/umya-spreadsheet" }
