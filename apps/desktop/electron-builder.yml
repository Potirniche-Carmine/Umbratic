appId: ai.umbratic.desktop
productName: Umbratic
artifactName: Umbratic-${version}.${ext}
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false
electronDist: ../../node_modules/electron/dist
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: .package/code-index
    to: code-index
  - from: .package/desktop-core
    to: desktop-core
  - from: .package/pdf
    to: pdf
  - from: .package/runner
    to: runner
  - from: .package/veil
    to: veil
mac:
  icon: assets/icons/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
win:
  icon: assets/icons/icon.ico
  target:
    - nsis
nsis:
  include: scripts/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Umbratic
  uninstallDisplayName: Umbratic
