[package]
name = "umbratic-pdf"
version = "0.0.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lopdf = { version = "=0.45.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
tempfile = "3.20.0"

[lib]
name = "umbratic_pdf"
path = "src/lib.rs"

[[bin]]
name = "umbratic-pdf"
path = "src/main.rs"
