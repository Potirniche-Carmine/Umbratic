[package]
name = "umbratic-artifacts"
version = "0.0.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
calamine = "=0.36.1"
rust_xlsxwriter = { version = "=0.99.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
umya-spreadsheet = "=3.0.1"
zip = "=8.6.0"

[dev-dependencies]
tempfile = "3.20.0"

[lib]
name = "umbratic_artifacts"
path = "src/lib.rs"

[[bin]]
name = "umbratic-artifacts"
path = "src/main.rs"
