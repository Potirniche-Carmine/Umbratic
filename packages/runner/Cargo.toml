[package]
name = "umbratic-runner"
version = "0.0.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["now"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
globset = "0.4.16"
http-body-util = "0.1.4"
libc = "0.2.174"
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Already in the tree through reqwest. Direct so certificate pinning can run
# inside the TLS handshake rather than after the request body is sent.
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.0", features = ["std"] }
webpki-roots = "1.0.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.46.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
umbratic-pdf = { path = "../pdf" }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.20.0"

[[bin]]
name = "umbratic-runner"
path = "src/main.rs"
