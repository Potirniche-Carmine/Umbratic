[package]
name = "umbratic-runner"
version = "0.0.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8.4"
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
futures-util = "0.3.31"
globset = "0.4.16"
http-body-util = "0.1.4"
libc = "0.2.174"
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "native-tls", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.46.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.20.0"

[[bin]]
name = "umbratic-runner"
path = "src/main.rs"
