{{define "brand-mark"}}<span class="brand-mark" aria-hidden="true"></span>{{end}}

{{define "topbar"}}
<nav class="topbar" aria-label="Main navigation">
  <a class="brand" href="/">{{template "brand-mark"}}<span>Veil Console</span></a>
  <div class="nav-links">
    <a href="/" {{if eq .Title "Veil Console"}}aria-current="page"{{end}}>Overview</a>
    <a href="/access" {{if eq .Title "Management"}}aria-current="page"{{end}}>Management</a>
    <a href="/documents" {{if eq .Title "Documents"}}aria-current="page"{{end}}>Documents</a>
    <a href="/models" {{if eq .Title "Models"}}aria-current="page"{{end}}>Models</a>
    <a href="/settings" {{if eq .Title "Settings"}}aria-current="page"{{end}}>Settings</a>
  </div>
  <form class="signout" method="post" action="/logout" data-session-logout>
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button class="nav-action nav-signout" type="submit">Sign out</button>
  </form>
</nav>
{{end}}

{{define "banners"}}
<div class="banner-stack" aria-live="assertive">
  {{if .Error}}<p class="banner error" role="alert">{{.Error}}</p>{{end}}
  {{if .Notice}}<p class="banner notice" role="status">{{.Notice}}</p>{{end}}
</div>
{{end}}
