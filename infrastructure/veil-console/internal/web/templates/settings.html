{{define "settings.html"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="icon" href="/favicon.ico?v=9">
  <link rel="stylesheet" href="/assets/style.css?v=10">
  <link rel="stylesheet" href="/assets/settings.css?v=10">
  <script defer src="/assets/console.js?v=10"></script>
</head>
<body>
<main class="app-shell">
  {{template "topbar" .}}

  <div class="page">
    <header class="page-header">
      <h1>Settings</h1>
    </header>

    {{if .Error}}<p class="banner error" role="alert">{{.Error}}</p>{{end}}
    {{if .Notice}}<p class="banner notice" role="status">{{.Notice}}</p>{{end}}

    <form class="settings-form" method="post" data-settings-form>
      <input type="hidden" name="csrf" value="{{.CSRF}}">

      <section class="panel">
        <div class="section-heading">
          <h2>Model</h2>
        </div>

        <div class="field-grid">
          <div class="field">
            <span id="runtime-label">Runtime</span>
            <div class="choice" data-choice>
              <input type="hidden" name="protocol" value="{{.Config.Protocol}}" data-provider data-choice-input>
              <button class="choice-trigger" type="button" aria-labelledby="runtime-label runtime-value" aria-haspopup="listbox" aria-expanded="false" data-choice-trigger>
                <span id="runtime-value" data-choice-label>{{if eq .Config.Protocol "vllm"}}vLLM{{else}}Ollama{{end}}</span>
                <span class="choice-chevron" aria-hidden="true"></span>
              </button>
              <div class="choice-menu" role="listbox" aria-labelledby="runtime-label" data-choice-menu hidden>
                <button type="button" role="option" data-choice-value="ollama" aria-selected="{{eq .Config.Protocol "ollama"}}">Ollama</button>
                <button type="button" role="option" data-choice-value="vllm" aria-selected="{{eq .Config.Protocol "vllm"}}">vLLM</button>
              </div>
            </div>
          </div>

          <label class="field">
            <span>Runtime URL</span>
            <input type="url" name="provider_base_url" value="{{.Config.ProviderBaseURL}}" data-provider-url required>
          </label>

          <div class="field field-full">
            <span id="model-label">Model</span>
            {{if .Models}}
            <div class="choice" data-choice>
              <input type="hidden" name="model" value="{{.Config.Model}}" data-choice-input>
              <button class="choice-trigger" type="button" aria-labelledby="model-label model-value" aria-haspopup="listbox" aria-expanded="false" data-choice-trigger>
                <span id="model-value" data-choice-label>{{.Config.Model}}</span>
                <span class="choice-chevron" aria-hidden="true"></span>
              </button>
              <div class="choice-menu" role="listbox" aria-labelledby="model-label" data-choice-menu hidden>
                {{range .Models}}<button type="button" role="option" data-choice-value="{{.}}" aria-selected="{{eq . $.Config.Model}}">{{.}}</button>{{end}}
              </div>
            </div>
            {{else}}
            <input name="model" value="{{.Config.Model}}" maxlength="256" placeholder="llama3.2" required>
            {{end}}
          </div>
        </div>

        <div class="slider-field">
          <div class="slider-heading">
            <label for="context-slider">Context window</label>
          </div>
          <input type="hidden" name="context_length" value="{{.Config.ContextLength}}" data-context-value>
          <div class="range-control">
            <input
              class="range"
              id="context-slider"
              type="range"
              min="0"
              max="7"
              step="1"
              value="{{.ContextIndex}}"
              data-context-slider
            >
            <output class="range-value" for="context-slider" data-context-label>{{.ContextLabel}}</output>
          </div>
          <div class="range-options" aria-label="Context window choices">
            <button type="button" data-context-option data-index="0">8K</button>
            <button type="button" data-context-option data-index="1">16K</button>
            <button type="button" data-context-option data-index="2">32K</button>
            <button type="button" data-context-option data-index="3">64K</button>
            <button type="button" data-context-option data-index="4">128K</button>
            <button type="button" data-context-option data-index="5">256K</button>
            <button type="button" data-context-option data-index="6">512K</button>
            <button type="button" data-context-option data-index="7">1M</button>
          </div>
        </div>
      </section>

      <details class="panel disclosure">
        <summary>
          <strong>Advanced</strong>
          <span class="disclosure-mark" aria-hidden="true"></span>
        </summary>
        <div class="advanced-content">
          <div class="field-grid advanced-grid">
            <label class="field">
              <span>Maximum output</span>
              <div class="input-suffix">
                <input type="number" name="max_output_tokens" value="{{.Config.MaxOutputTokens}}" min="1" max="32768" required>
                <span>tokens</span>
              </div>
            </label>
            <label class="field">
              <span>Model timeout</span>
              <input name="model_timeout" value="{{.Config.ModelTimeout}}" required>
            </label>
            <label class="field">
              <span>Request timeout</span>
              <input name="request_timeout" value="{{.Config.RequestTimeout}}" required>
            </label>
          </div>

          <div class="slider-field">
            <div class="slider-heading">
              <label for="body-size-slider">Request size</label>
            </div>
            <input type="hidden" name="max_body_bytes" value="{{.Config.MaxBodyBytes}}" data-body-bytes>
            <div class="range-control">
              <input
                class="range"
                id="body-size-slider"
                type="range"
                min="0"
                max="4"
                step="1"
                value="{{.BodySizeIndex}}"
                data-body-slider
              >
              <output class="range-value" for="body-size-slider" data-body-label>{{.BodySizeLabel}}</output>
            </div>
            <div class="range-options" aria-label="Request size choices">
              <button type="button" data-body-option data-index="0">16 MiB</button>
              <button type="button" data-body-option data-index="1">32 MiB</button>
              <button type="button" data-body-option data-index="2">64 MiB</button>
              <button type="button" data-body-option data-index="3">128 MiB</button>
              <button type="button" data-body-option data-index="4">256 MiB</button>
            </div>
          </div>
        </div>
      </details>

      <section class="panel apply-panel">
        <label class="field password-field">
          <span>Owner password</span>
          <input type="password" name="password" autocomplete="current-password" {{if .PasswordError}}aria-invalid="true" aria-describedby="password-error"{{end}} required>
          {{if .PasswordError}}<small class="field-error" id="password-error" role="alert">Owner password is incorrect.</small>{{end}}
        </label>
        <div class="apply-actions">
          <button class="button secondary" formaction="/settings/test" type="submit">Test connection</button>
          <button class="button primary" formaction="/settings/apply" type="submit">Apply and restart</button>
        </div>
      </section>
    </form>
  </div>
</main>
</body>
</html>{{end}}
