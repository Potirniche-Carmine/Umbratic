{{define "login.html"}}<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="icon" href="/favicon.ico?v=8"><link rel="stylesheet" href="/assets/style.css?v=17"><link rel="stylesheet" href="/assets/access.css?v=14"><script defer src="/assets/console.js?v=17"></script></head>
<body>
<main class="auth-page">
  <section class="card auth-card">
    <div class="auth-brand">{{template "brand-mark"}}<span>Veil Console</span></div>
    <header><h1>Sign in</h1></header>
    <p class="error auth-error{{if not .Error}} is-empty{{end}}" role="alert">{{.Error}}</p>
    <form method="post" action="/login" data-login-form data-retry-after="{{.RetryAfterSeconds}}">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button primary full-button" type="submit" data-login-submit>Sign in</button>
    </form>
  </section>
</main>
</body>
</html>{{end}}
