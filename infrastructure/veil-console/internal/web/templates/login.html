{{define "login.html"}}<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="icon" href="/favicon.ico?v=6"><link rel="stylesheet" href="/assets/style.css?v=6"></head>
<body>
<main class="auth-page">
  <section class="card auth-card">
    <div class="auth-brand">{{template "brand-mark"}}<span>Veil Console</span></div>
    <header><h1>Sign in</h1></header>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button primary full-button" type="submit">Sign in</button>
    </form>
  </section>
</main>
</body>
</html>{{end}}
