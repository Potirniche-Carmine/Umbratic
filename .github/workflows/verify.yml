name: Audit

# Solo-developer CI: pull requests get a fast dependency audit and nothing
# else — the full test-and-build verification is runnable locally and still
# gates every tagged release in package-desktop.yml, which is the only place
# binaries are built. Nothing runs on merges to main.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Lockfile-only, so no dependency install and no toolchain setup: the
      # whole job stays under a minute. The deeper Rust/Go audits and
      # provenance checks still run in the tagged-release workflow.
      - name: Audit npm dependency vulnerabilities
        run: npm audit --package-lock-only --ignore-scripts --omit=peer --audit-level=low
