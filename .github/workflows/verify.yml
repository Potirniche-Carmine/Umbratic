name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up patched Python for repository checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infrastructure/veil/go.mod
          cache-dependency-path: infrastructure/**/go.sum
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install locked dependencies without lifecycle scripts
        id: dependencies
        run: npm ci --ignore-scripts --omit=peer
      - run: node scripts/check-release-version.ts
      - id: electron
        run: npm run dependencies:provision
      - name: Run complete verification suite
        run: npm run test:all
      - name: Provision and verify reviewed Windows signing tools
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/ci/install-windows-signing.ps1
      - name: Install reviewed Vulkan SDK
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && matrix.os == 'windows-2025' }}
        shell: pwsh
        run: ./scripts/ci/install-vulkan.ps1
      - name: Build installers and smoke-test production native resources
        id: installers
        if: ${{ !cancelled() && steps.electron.outcome == 'success' }}
        run: npm run desktop:release -- --unsigned
      - name: Verify installer archives and actual updater checksums
        if: ${{ !cancelled() && steps.installers.outcome == 'success' }}
        run: node scripts/ci/verify-installer-artifacts.ts

  audit:
    name: Dependency and workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infrastructure/veil/go.mod
          cache-dependency-path: infrastructure/**/go.sum
      - run: rustup show active-toolchain
      - run: npm ci --ignore-scripts --omit=peer
      - run: cargo install cargo-audit --locked --version "$(node -p 'JSON.parse(require("fs").readFileSync("supply-chain-policy.json")).cargoAuditVersion')"
      - run: go install "golang.org/x/vuln/cmd/govulncheck@v$(node -p 'JSON.parse(require("fs").readFileSync("supply-chain-policy.json")).govulncheckVersion')"
      - name: Race-test Go services and Caddy on Linux
        env:
          CGO_ENABLED: '1'
        run: |
          go -C infrastructure/veil test -race ./...
          go -C infrastructure/veil-console test -race ./...
          go -C infrastructure/veil-console/deploy/caddy test -race ./... github.com/go-jose/go-jose/v3/...
      - run: npm run supply-chain:audit
      - name: Fetch locked Cargo sources for offline SBOM generation
        run: cargo fetch --locked
      - run: npm run supply-chain:sbom
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  required:
    name: CI required
    if: always()
    needs: [verify, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(. == "success")' <<< "$RESULTS"
