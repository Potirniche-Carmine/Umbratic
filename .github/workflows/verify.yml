name: Audit

# Solo-developer CI: pull requests get a fast dependency audit and nothing
# else. Releases are built on the two local machines and published to
# downloads.umbratic.ai — see docs/releasing.md. Nothing runs on merges to main.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Lockfile-only, so no dependency install and no toolchain setup: the
      # whole job stays under a minute. Deeper Rust/Go audits run locally
      # with npm run supply-chain:audit before a release.
      - name: Audit npm dependency vulnerabilities
        run: npm audit --package-lock-only --ignore-scripts --omit=peer --audit-level=low
