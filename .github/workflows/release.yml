name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  source:
    name: Select verified main source
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prepare: ${{ steps.source.outputs.prepare }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out event commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify CI source and release identity
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/ci/select-release.ts

  package:
    name: Sign and verify (${{ matrix.os }})
    needs: source
    if: needs.source.outputs.prepare == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MACOS_CERTIFICATE_P12: ${{ matrix.os == 'macos-15' && secrets.MACOS_CERTIFICATE_P12 || '' }}
      MACOS_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-15' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.os == 'macos-15' && secrets.APPLE_NOTARY_APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-15' && secrets.APPLE_NOTARY_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.os == 'macos-15' && vars.APPLE_TEAM_ID || '' }}
      UMBRATIC_WIN_SIGN_ENDPOINT: ${{ matrix.os != 'macos-15' && vars.UMBRATIC_WIN_SIGN_ENDPOINT || '' }}
      UMBRATIC_WIN_SIGN_ACCOUNT: ${{ matrix.os != 'macos-15' && vars.UMBRATIC_WIN_SIGN_ACCOUNT || '' }}
      UMBRATIC_WIN_SIGN_PROFILE: ${{ matrix.os != 'macos-15' && vars.UMBRATIC_WIN_SIGN_PROFILE || '' }}
      UMBRATIC_WIN_SIGN_PUBLISHER: ${{ matrix.os != 'macos-15' && vars.UMBRATIC_WIN_SIGN_PUBLISHER || '' }}
      AZURE_TENANT_ID: ${{ matrix.os != 'macos-15' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ matrix.os != 'macos-15' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ matrix.os != 'macos-15' && secrets.AZURE_CLIENT_SECRET || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out event commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require release credentials
        run: |
          node --input-type=module -e '
            import { requireSigningEnvironment } from "./scripts/release-env.ts";
            requireSigningEnvironment();
            const required = process.platform === "darwin"
              ? ["MACOS_CERTIFICATE_P12", "MACOS_CERTIFICATE_PASSWORD"]
              : ["AZURE_TENANT_ID", "AZURE_CLIENT_ID", "AZURE_CLIENT_SECRET"];
            for (const key of required) if (!process.env[key]?.trim()) throw new Error("Missing release secret " + key);
          '
      - name: Configure temporary macOS signing identity
        if: runner.os == 'macOS'
        run: bash scripts/ci/configure-macos-signing.sh
      - name: Provision reviewed Windows signing tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-windows-signing.ps1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infrastructure/veil/go.mod
          cache: false
      - run: rustup show active-toolchain
      - name: Install reviewed Vulkan SDK
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: ./scripts/ci/install-vulkan.ps1
      - run: npm ci --ignore-scripts --omit=peer
      - run: npm run dependencies:provision
      - name: Build, sign, notarize and smoke-test
        run: npm run desktop:release
      - name: Verify signatures and stage installers and updater metadata
        run: node scripts/ci/verify-release.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.os }}
          path: target/release/upload/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove temporary signing material
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/umbratic-release.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/umbratic-signing.p12" "$RUNNER_TEMP/umbratic-signing-probe"


  publish:
    name: Publish verified GitHub release
    needs: [source, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out event commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=peer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-*
          path: target/release/upload
          merge-multiple: true
      - name: Validate complete release and publish atomically
        run: node scripts/ci/publish-release.ts
