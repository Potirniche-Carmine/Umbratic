name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  source:
    name: Select verified main source
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prepare: ${{ steps.source.outputs.prepare }}
      tag: ${{ steps.source.outputs.tag }}
      ci-run-id: ${{ steps.source.outputs.ci-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out event commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify CI source and release identity
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/ci/select-release.ts

  macos:
    name: Sign and notarize macOS
    needs: source
    if: needs.source.outputs.prepare == 'true'
    runs-on: macos-15
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out event commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require macOS signing credentials
        run: |
          node --input-type=module -e '
            import { requireSigningEnvironment } from "./scripts/release-env.ts";
            requireSigningEnvironment();
            const required = ["MACOS_CERTIFICATE_P12", "MACOS_CERTIFICATE_PASSWORD"];
            for (const key of required) if (!process.env[key]?.trim()) throw new Error("Missing release secret " + key);
          '
      - name: Configure temporary macOS signing identity
        run: bash scripts/ci/configure-macos-signing.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infrastructure/veil/go.mod
          cache: false
      - run: rustup show active-toolchain
      - run: npm ci --ignore-scripts --omit=peer
      - run: npm run dependencies:provision
      - name: Identify the exact native runtime build inputs
        id: native_cache_key
        run: node scripts/ci/build-cache.ts
      - name: Restore trusted native runtime builds without saving release state
        id: native_cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.llama-cache
          key: ${{ steps.native_cache_key.outputs.native-key }}
      - name: Discard an incomplete native cache restore
        if: ${{ !cancelled() && steps.native_cache.outcome == 'failure' }}
        run: node --input-type=module -e 'import fs from "node:fs"; fs.rmSync("apps/desktop/.llama-cache", { recursive:true, force:true });'
      - name: Build, sign, notarize and smoke-test
        run: npm run desktop:release
      - name: Verify signatures and stage installers and updater metadata
        run: node scripts/ci/verify-release.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: target/release/upload/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove temporary signing material
        if: always()
        run: |
          keychain="$RUNNER_TEMP/umbratic-release.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/umbratic-signing.p12" "$RUNNER_TEMP/umbratic-signing-probe"

  windows:
    name: Promote verified unsigned Windows installers
    needs: source
    if: needs.source.outputs.prepare == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ needs.source.outputs.ci-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out event commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=peer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.ci-run-id }}
          pattern: ci-installers-*
          path: target/release/ci-input
          merge-multiple: true
      - name: Verify trusted-main CI provenance and promote exact unsigned Windows bytes
        run: node scripts/ci/promote-windows-release.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-unsigned
          path: target/release/upload/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  publish:
    name: Publish verified GitHub release
    needs: [source, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out event commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=peer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/release/upload
          merge-multiple: true
      - name: Validate final release bytes and prepare attestation subjects
        run: node scripts/ci/prepare-release-attestation.ts
      - name: Attest every final release asset
        id: attest_release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/upload/*
          create-storage-record: false
          push-to-registry: false
      - name: Preserve the authenticated release provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_release.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" target/release/upload/release-provenance.jsonl
      - name: Validate complete release and publish atomically
        run: node scripts/ci/publish-release.ts
