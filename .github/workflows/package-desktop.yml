name: Package Desktop Harness

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: infrastructure/veil/go.mod
          cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm run test:all

  package:
    name: Package ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package_args: "--mac dmg"
            artifact_name: umbratic-ai-macos
            artifact_paths: |
              apps/desktop/release/*.dmg
          - name: Windows
            os: windows-latest
            package_args: "--win nsis --x64"
            artifact_name: umbratic-ai-windows
            artifact_paths: |
              apps/desktop/release/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: infrastructure/veil/go.mod
          cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Package desktop harness
        run: npm --workspace @umbratic/desktop run package -- ${{ matrix.package_args }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Umbratic AI desktop harness release $tag"
          fi
          while IFS= read -r asset; do
            [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" -y
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          gh release upload "$tag" release-artifacts/* --clobber
