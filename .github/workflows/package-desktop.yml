name: Package Desktop Harness

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: infrastructure/veil/go.mod
          cache: false

      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt --no-self-update && rustup default 1.96.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Audit Rust dependencies
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Audit dependency vulnerabilities and provenance
        run: npm run supply-chain:audit

      - name: Generate locked dependency SBOM
        run: npm run supply-chain:sbom

      - name: Verify release
        env:
          CARGO_NET_OFFLINE: "true"
        run: npm run release:check

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: umbratic-supply-chain-metadata
          path: artifacts/supply-chain/umbratic-sbom.cdx.json
          if-no-files-found: error

  package:
    name: Package ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            package_args: "--mac dmg"
            artifact_name: umbratic-ai-macos
            artifact_paths: |
              apps/desktop/release/*.dmg
          - name: Windows
            os: windows-2025
            package_args: "--win nsis --x64"
            artifact_name: umbratic-ai-windows
            artifact_paths: |
              apps/desktop/release/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: infrastructure/veil/go.mod
          cache: false

      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt --no-self-update && rustup default 1.96.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Provision checksum-verified Electron runtime
        run: npm run dependencies:provision

      - name: Package desktop harness
        env:
          CARGO_NET_OFFLINE: "true"
        run: npm --workspace @umbratic/desktop run package -- ${{ matrix.package_args }}

      - name: Smoke test packaged native resources
        run: npm --workspace @umbratic/desktop run verify:package

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate release checksums
        run: |
          set -euo pipefail
          find release-artifacts -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | sed 's#release-artifacts/##' > release-artifacts/SHA256SUMS

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Umbratic AI desktop harness release $tag"
          fi
          gh release upload "$tag" release-artifacts/*
