version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      npm-routine:
        update-types: [minor, patch]
    cooldown:
      default-days: 14

  - package-ecosystem: cargo
    directory: /
    groups:
      rust-routine:
        update-types: [minor, patch]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14

  - package-ecosystem: gomod
    directory: /infrastructure/veil
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14

  - package-ecosystem: gomod
    directory: /infrastructure/veil-console
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-routine:
        update-types: [minor, patch]
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: /
    groups:
      actions-routine:
        patterns: ["*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
